<div lang="ru" style="white-space:pre-wrap">Будь здорова
я сидела в аэропорту, было душно, мерзко, скверно, шумно,
я чихнула - должно быть, южная пыльная простуда
я так подумала - очень бывает грустно,
когда рядом нет никого, кто бы с суровым русским теплом мне сказал:
«будь здорова»
и обнял
хриплым кашлем московской нежности</div>
