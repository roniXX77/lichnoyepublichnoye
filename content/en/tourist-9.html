<div style="white-space:pre-wrap">Bless you
i was sitting at the airport, it was stuffy, nasty, foul, loud,
i sneezed - must be a dusty southern cold
i thought to myself - it does get very sad,
when there’s nobody around to tell me with stern russian warmth:
«bless you»
and hug me
with a raspy cough of moscow tenderness</div>
