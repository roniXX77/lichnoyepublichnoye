name: Publish lichnoyepublichnoye

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Build content catalogs
        run: python3 scripts/build-content.py
      - name: Check site references and texts
        run: python3 scripts/check.py
      - name: Check persistent timer
        run: node --test tests/timer.test.cjs
      - name: Check media seeking server
        run: python3 tests/serve.test.py
      - name: Package website
        run: python3 scripts/package-site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
